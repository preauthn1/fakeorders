<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <title>更新页面</title>
    <link rel="stylesheet" href="/app/admin/component/pear/css/pear.css?v=<?=get_version() ?>"/>
    <link rel="stylesheet" href="/app/admin/admin/css/reset.css?v=<?=get_version() ?>"/>
</head>
<body>

<form class="layui-form">
    <div class="mainBox">
        <div class="main-container mr-5">
            <div class="layui-form-item">
                <label class="layui-form-label required" data-lang="用户">用户</label>
                <div class="layui-input-block">
                    <input type="text" name="user_id" value="" disabled class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label required" data-lang="视频">视频</label>
                <div class="layui-input-block">
                    <input type="text" name="video_id" value="" disabled class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label required" data-lang="收益">收益</label>
                <div class="layui-input-block">
                    <input type="text" name="profit" value="" disabled class="layui-input">
                </div>
            </div>
            <div class="layui-form-item" id="pay_img_div">
                <label class="layui-form-label" data-lang="图片">图片</label>
                <div class="layui-input-block" id="image-container">
                    <!-- 图片将通过JavaScript动态加载 -->
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label" data-lang="状态">状态</label>
                <div class="layui-input-block">
                    <input type="radio" name="status" value="1" title="进行中" data-lang="进行中" checked/>
                    <input type="radio" name="status" value="2" title="审核中" data-lang="审核中"/>
                    <input type="radio" name="status" value="3" title="审核失败" data-lang="审核失败"/>
                    <input type="radio" name="status" value="4" title="已完成" data-lang="已完成"/>
                </div>
            </div>
        </div>
    </div>
    <div class="bottom">
        <div class="button-container">
            <button type="submit" class="pear-btn pear-btn-primary pear-btn-md" lay-submit="" lay-filter="save">
                <span data-lang="提交">提交</span>
            </button>
            <button type="reset" class="pear-btn pear-btn-md">
                <span data-lang="重置">重置</span>
            </button>
        </div>
    </div>

</form>

<script src="/app/admin/component/layui/layui.js?v=<?=layui_version() ?>"></script>
<script src="/app/admin/component/pear/pear.js?v=<?=get_version() ?>"></script>
<script src="/app/admin/admin/js/permission.js"></script>
<script>

    // 相关接口
    const PRIMARY_KEY = "id";
    const SELECT_API = "/app/admin/videotask/select" + location.search;
    const UPDATE_API = "/app/admin/videotask/update";
    // 获取数据库记录
    layui.use(["form", "util", "popup"], function () {
        let $ = layui.$;
        $.ajax({
            url: SELECT_API,
            dataType: "json",
            success: function (res) {

                // 给表单初始化数据
                layui.each(res.data[0], function (key, value) {
                    let obj = $('*[name="' + key + '"]');
                    if (key === "password") {
                        obj.attr("placeholder", getText("不更新密码请留空"));
                        return;
                    }
                    if (key === "img") {
                        // 处理图片数组显示
                        try {
                            let images = typeof value === 'string' ? JSON.parse(value) : value;
                            let imageContainer = $('#image-container');
                            imageContainer.empty();
                            if (Array.isArray(images) && images.length > 0) {
                                images.forEach(function (imgSrc) {
                                    imageContainer.append(
                                        '<img src="' + imgSrc + '" style="max-width: 200px;width: 160px; height: auto; margin: 5px; border: 1px solid #ddd; border-radius: 4px;">'
                                    );
                                });
                            } else {
                                imageContainer.append('<span data-lang="暂无图片">暂无图片</span>');
                            }
                        } catch (e) {
                            $("#pay_img_div").hide();
                        }
                        return;
                    }
                    if (typeof obj[0] === "undefined" || !obj[0].nodeName) return;
                    if (obj[0].nodeName.toLowerCase() === "textarea") {
                        obj.val(layui.util.escape(value));
                    } else if (obj[0].nodeName.toLowerCase() === "input" && obj.attr("type") === "radio") {
                        // 处理单选按钮的初始化选中状态
                        obj.each(function () {
                            if (value > 2) {
                                $(this).prop("disabled", true);
                            }
                            if ($(this).val() == value) {
                                $(this).prop("checked", true);
                            }
                        });
                    } else {
                        obj.attr("value", value);
                    }
                });
                layui.form.render();
                // ajax产生错误
                if (res.code) {
                    layui.popup.failure(res.msg);
                }

            }
        });
    });

    //提交事件
    layui.use(["form", "popup"], function () {
        layui.form.on("submit(save)", function (data) {
            data.field[PRIMARY_KEY] = layui.url().search[PRIMARY_KEY];
            layui.$.ajax({
                url: UPDATE_API,
                type: "POST",
                dateType: "json",
                data: data.field,
                success: function (res) {
                    if (res.code) {
                        return layui.popup.failure(getText(res.msg));
                    }
                    return layui.popup.success(getText("操作成功"), function () {
                        parent.refreshTable();
                        parent.layer.close(parent.layer.getFrameIndex(window.name));
                    });
                }
            });
            return false;
        });
    });

</script>

</body>

</html>
