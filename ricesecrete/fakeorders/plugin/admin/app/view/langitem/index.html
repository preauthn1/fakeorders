<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="utf-8">
    <title>浏览页面</title>
    <link rel="stylesheet" href="/app/admin/component/pear/css/pear.css?v=<?=get_version() ?>"/>
    <link rel="stylesheet" href="/app/admin/admin/css/reset.css?v=<?=get_version() ?>"/>
</head>
<body class="pear-container">

<!-- 顶部查询表单 -->
<div class="layui-card">
    <div class="layui-card-body">
        <form class="layui-form top-search-from">
            <div class="layui-form-item">
                <label class="layui-form-label" data-lang="类型">类型</label>
                <div class="layui-input-block">
                    <select name="type" class="layui-select">
                        <option value="0" data-lang="前端">前端</option>
                        <option value="1" data-lang="后台">后台</option>
                    </select>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label" data-lang="条目名称">条目名称</label>
                <div class="layui-input-block">
                    <input type="text" name="title[0]" style="display: none" value="like" class="layui-input">
                    <input type="text" name="title[1]" value="" class="layui-input" data-lang="请输入条目名称"
                           placeholder="请输入条目名称">
                </div>
            </div>
            <div class="layui-form-item layui-inline">

                <button class="pear-btn pear-btn-md pear-btn-primary" lay-submit lay-filter="table-query">
                    <i class="layui-icon layui-icon-search"></i><span data-lang="查询">查询</span>
                </button>
                <button type="reset" class="pear-btn pear-btn-md" lay-submit lay-filter="table-reset">
                    <i class="layui-icon layui-icon-refresh"></i><span data-lang="重置">重置</span>
                </button>
            </div>
            <div class="toggle-btn">
                <a class="layui-hide"><span data-lang="展开">展开</span><i class="layui-icon layui-icon-down"></i></a>
                <a class="layui-hide"><span data-lang="收起">收起</span><i class="layui-icon layui-icon-up"></i></a>
            </div>
        </form>
    </div>
</div>

<!-- 数据表格 -->
<div class="layui-card">
    <div class="layui-card-body">
        <table id="data-table" lay-filter="data-table"></table>
    </div>
</div>

<!-- 表格顶部工具栏 -->
<script type="text/html" id="table-toolbar">
    <button class="pear-btn pear-btn-primary pear-btn-md" lay-event="add" permission="app.admin.langItem.insert">
        <i class="layui-icon layui-icon-add-1"></i>{{= getText('新增') }}
    </button>
    <button class="pear-btn pear-btn-danger pear-btn-md" lay-event="batchRemove" permission="app.admin.langItem.delete">
        <i class="layui-icon layui-icon-delete"></i>{{= getText('删除') }}
    </button>
    <button class="pear-btn pear-btn-md pear-btn-primary" lay-event="import">
        <i class="layui-icon layui-icon-file"></i>{{= getText('导入') }}
    </button>
    <button class="pear-btn pear-btn-md pear-btn-danger" lay-event="export">
        <i class="layui-icon layui-icon-file"></i>{{= getText('导出') }}
    </button>

</script>

<!-- 表格行工具栏 -->
<script type="text/html" id="table-bar">
    <button class="pear-btn pear-btn-xs tool-btn" lay-event="edit" permission="app.admin.langItem.update">{{=
        getText('编辑') }}
    </button>
    <button class="pear-btn pear-btn-xs tool-btn" lay-event="remove" permission="app.admin.langItem.delete">{{=
        getText('删除') }}
    </button>
</script>

<script src="/app/admin/component/layui/layui.js?v=<?=layui_version() ?>"></script>
<script src="/app/admin/component/pear/pear.js?v=<?=get_version() ?>"></script>
<script src="/app/admin/admin/js/permission.js"></script>
<script src="/app/admin/admin/js/common.js"></script>
<script>

    // 相关常量
    const PRIMARY_KEY = "id";
    const SELECT_API = "/app/admin/langItem/select";
    const UPDATE_API = "/app/admin/langItem/update";
    const DELETE_API = "/app/admin/langItem/delete";
    const INSERT_URL = "/app/admin/langItem/insert";
    const UPDATE_URL = "/app/admin/langItem/update";
    let columns = '<?=$columns?>';
    // 表格渲染
    layui.use(["table", "form", "common", "popup", "util"], function () {
        let table = layui.table;
        let form = layui.form;
        let $ = layui.$;
        let common = layui.common;
        let util = layui.util;

        // 表头参数
        let cols = JSON.parse(columns);
        cols.forEach((item) => {
            if (item.title) {
                item.title = getText(item.title);
            }
            if (item.field == 'type') {
                item.templet = function (d) {
                    return getText(d.type == 0 ? '前端' : '后台');
                }
            }
        })

        // 渲染表格
        function render() {
            table.render({
                elem: "#data-table",
                url: SELECT_API,
                page: {
                    layout: ['count', 'prev', 'page', 'next', 'limit', 'refresh', 'skip'],
                    groups: 5,
                    first: getText("首页"),
                    last: getText("尾页"),
                    prev: getText("上一页"),
                    next: getText("下一页"),
                    limits: [10, 20, 30, 40, 50],
                    limit: 10,
                    limitTemplet: function (curr, limit) {
                        return curr + " " + getText("条/页");
                    },
                    // limitTips: [getText("当前页"), getText("条/页"), getText("共"), getText("条")],
                    skipText: [getText("跳转"), '', getText("确认")],
                    countText: [getText("共") + " ", " " + getText("页")]
                },
                cols: [cols],
                skin: "line",
                size: "lg",
                toolbar: "#table-toolbar",
                autoSort: false,
                text: {
                    none: getText("暂无数据")
                },
                defaultToolbar: [{
                    title: getText("刷新"),
                    layEvent: "refresh",
                    icon: "layui-icon-refresh",
                }, "filter", "print", "exports"],
                done: function () {
                    layer.photos({photos: 'div[lay-id="data-table"]', anim: 5});
                }
            });
        }

        // 编辑或删除行事件
        table.on("tool(data-table)", function (obj) {
            if (obj.event === "remove") {
                remove(obj);
            } else if (obj.event === "edit") {
                edit(obj);
            }
        });

        // 表格顶部工具栏事件
        table.on("toolbar(data-table)", function (obj) {
            if (obj.event === "add") {
                add();
            } else if (obj.event === "refresh") {
                refreshTable();
            } else if (obj.event === "batchRemove") {
                batchRemove(obj);
            } else if (obj.event === "export") {
                $.ajax({
                    url: SELECT_API,
                    data: {
                        is_file: "file"
                    },
                    dataType: "json",
                    type: "post",
                    success: function (res) {
                        // console.log(res);
                        if (res.data) {
                            //打开新窗口
                            let protocol = window.location.protocol;
                            let host = window.location.host;
                            let path = protocol + '//' + host;
                            // console.log(path + '/' + res.data);
                            window.open(path + '/' + res.data);
                        }
                    }
                })
            } else if (obj.event === "import") {
                // 创建文件上传弹窗
                layer.open({
                    type: 1,
                    title: getText("导入语言包"),
                    shade: 0.1,
                    area: ['500px', '300px'],
                    content: `            <div style="padding: 20px;">
                <form id="import-form" enctype="multipart/form-data">
                    <div class="layui-form-item">
                        <label class="layui-form-label" data-lang="选择文件">选择文件</label>
                        <div class="layui-input-block">
                            <input type="file" name="file" id="import-file" class="layui-input" accept=".csv" required>
                            <div class="layui-form-mid layui-word-aux" data-lang="请选择CSV格式的语言包文件">请选择CSV格式的语言包文件</div>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <div class="layui-input-block">
                            <button type="button" class="pear-btn pear-btn-primary" id="upload-btn" data-lang="上传">上传</button>
                            <button type="button" class="pear-btn" id="cancel-btn" data-lang="取消">取消</button>
                        </div>
                    </div>
                </form>
            </div>
        `,
                    success: function (layero, index) {
                        // 绑定上传按钮事件
                        $('#upload-btn').on('click', function () {
                            let fileInput = $('#import-file')[0];
                            if (fileInput.files.length === 0) {
                                layui.popup.warning(getText("请选择要上传的文件"));
                                return;
                            }

                            let formData = new FormData();
                            formData.append('file', fileInput.files[0]);
                            formData.append('is_file', 'file');

                            // 显示加载状态
                            let loading = layer.load(1);

                            // 发送上传请求
                            $.ajax({
                                url: INSERT_URL,
                                type: 'POST',
                                data: formData,
                                processData: false,
                                contentType: false,
                                dataType: 'json',
                                success: function (res) {
                                    layer.close(loading);
                                    if (res.code === 0) {
                                        layui.popup.success(getText("导入成功"), function () {
                                            layer.close(index);
                                            refreshTable(); // 刷新表格
                                        });
                                    } else {
                                        layui.popup.failure(res.msg || getText("导入失败"));
                                    }
                                },
                                error: function () {
                                    layer.close(loading);
                                    layui.popup.failure(getText("上传失败，请重试"));
                                }
                            });
                        });

                        // 绑定取消按钮事件
                        $('#cancel-btn').on('click', function () {
                            layer.close(index);
                        });
                    }
                });
            }
        });

        // 表格顶部搜索事件
        form.on("submit(table-query)", function (data) {
            table.reload("data-table", {
                page: {
                    curr: 1
                },
                where: data.field
            })
            return false;
        });

        // 表格顶部搜索重置事件
        form.on("submit(table-reset)", function (data) {
            table.reload("data-table", {
                where: []
            })
        });
        // 表格排序事件
        table.on("sort(data-table)", function (obj) {
            table.reload("data-table", {
                initSort: obj,
                scrollPos: "fixed",
                where: {
                    field: obj.field,
                    order: obj.type
                }
            });
        });

        // 表格新增数据
        let add = function () {
            layer.open({
                type: 2,
                title: getText("新增"),
                shade: 0.1,
                area: [common.isModile() ? "100%" : "70%", common.isModile() ? "100%" : "650px"],
                content: INSERT_URL
            });
        }

        // 表格编辑数据
        let edit = function (obj) {
            let value = obj.data[PRIMARY_KEY];
            layer.open({
                type: 2,
                title: getText("修改"),
                shade: 0.1,
                area: [common.isModile() ? "100%" : "70%", common.isModile() ? "100%" : "650px"],
                content: UPDATE_URL + "?" + PRIMARY_KEY + "=" + value
            });
        }

        // 删除一行
        let remove = function (obj) {
            return doRemove(obj.data[PRIMARY_KEY]);
        }

        // 删除多行
        let batchRemove = function (obj) {
            let checkIds = common.checkField(obj, PRIMARY_KEY);
            if (checkIds === "") {
                layui.popup.warning(getText("未选中数据"));
                return false;
            }
            doRemove(checkIds.split(","));
        }

        // 执行删除
        let doRemove = function (ids) {
            let data = {};
            data[PRIMARY_KEY] = ids;
            layer.confirm(getText("确定删除?"), {
                icon: 3,
                title: getText("提示")
            }, function (index) {
                layer.close(index);
                let loading = layer.load();
                $.ajax({
                    url: DELETE_API,
                    data: data,
                    dataType: "json",
                    type: "post",
                    success: function (res) {
                        layer.close(loading);
                        if (res.code) {
                            return layui.popup.failure(getText(res.msg));
                        }
                        return layui.popup.success(getText("操作成功"), refreshTable);
                    }
                })
            });
        }

        // 刷新表格数据
        window.refreshTable = function () {
            table.reloadData("data-table", {
                scrollPos: "fixed",
                done: function (res, curr) {
                    if (curr > 1 && res.data && !res.data.length) {
                        curr = curr - 1;
                        table.reloadData("data-table", {
                            page: {
                                curr: curr
                            },
                        })
                    }
                }
            });
        }
        render();
    })

</script>
</body>
</html>
